{% include base_path %}
{% include site/alt-url.html %}
{% if alt_exists %}
<link rel="alternate" hreflang="{{ page.lang }}" href="{{ site.url }}{{ page.url }}">
<link rel="alternate" hreflang="{% if page.lang == "ar" %}en{% else %}ar{% endif %}" href="{{ site.url }}{{ alt_url }}">
<link rel="alternate" hreflang="x-default" href="{{ site.url }}{% if page.lang == "ar" %}{{ alt_url }}{% else %}{{ page.url }}{% endif %}">
{% endif %}
<script>
  try { var t = localStorage.getItem("theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{% if page.lang == "ar" %}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;700&display=swap">
{% else %}
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
{% endif %}
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon.png">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-16x16.png" sizes="16x16">
<link rel="icon" type="image/png" href="{{ base_path }}/images/android-chrome-192x192.png" sizes="192x192">
<link rel="shortcut icon" href="{{ base_path }}/images/favicon.ico">
<meta name="theme-color" content="#F3F6F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1412" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="{{ base_path }}/assets/css/site.css">
