work:
  eyebrow: مختارات
  title: الأعمال
  intro: أوراق ونماذج ومكتبات، معظمها للغة العربية.
  items:
    - kind: ورقة بحثية · ICLR 2025
      title: MMTEB
      text: معيار ضخم لتقييم نماذج التضمين في أكثر من 250 لغة. مؤلفة مشاركة، وأسهمتُ ببيانات تقييم عربية.
      url: https://arxiv.org/abs/2502.13595
      go: arxiv.org/abs/2502.13595
    - kind: نموذج · عرض تجريبي
      title: RuqLM
      text: عائلة نماذج لغوية عربية صغيرة من 3 إلى 30 مليون معامل، بأوزان منشورة.
      url: https://ruqlm.web.app
      go: ruqlm.web.app
    - kind: مكتبة · PyPI
      title: ruqia
      text: تنظيف النصوص العربية وتوحيدها والتعامل مع التشكيل. استخدمتها في مساهمة MMTEB العربية.
      url: https://github.com/Ruqyai/Ruqia-Library
      go: pip install ruqia
    - kind: تطبيق · PaLM 2
      title: ChatBard
      text: من أوائل التطبيقات العربية على PaLM 2، وأشاد به حساب Google Cloud Tech، وحصل على 49 نجمة في GitHub.
      url: https://github.com/Ruqyai/ChatBard
      go: github.com/Ruqyai/ChatBard
    - kind: نماذج · ضبط دقيق
      title: Gemma 2 للعربية
      text: ضبط دقيق لنموذجي Gemma 2 بحجمي 2B و9B على بيانات عربية بتقنية LoRA، موزعاً على 8 وحدات GPU.
      url: https://huggingface.co/Ruqiya
      go: huggingface.co/Ruqiya
    - kind: وكلاء · Google ADK
      title: وكلاء التسويق
      text: وكلاء يكتبون محتوى LinkedIn وينشرونه ويتواصلون فيما بينهم عبر A2A، باستخدام Gemini 3 Pro.
      url: https://github.com/Ruqyai/Automated-Marketing-Social-Media-System
      go: github.com/Ruqyai

