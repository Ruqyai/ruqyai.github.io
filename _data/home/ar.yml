  bio: >-
    بنيتُ محرك البحث الذكي في Fyler من أول تصميم لبنيته حتى إدارة المنتج.
    أعمل الآن في أبحاث أمان الذكاء الاصطناعي وقابلية التفسير الآلي (Mechanistic Interpretability) مع <em>EleutherAI</em>.
    أنا خبيرة مطوري Google في مجالي الذكاء الاصطناعي والسحابة، وقضيت سنوات في تعليم الذكاء الاصطناعي بالعربية.
