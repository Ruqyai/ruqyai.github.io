work:
  eyebrow: Selected
  title: Work
  intro: Papers, models and libraries, most of them for Arabic.
  items:
    - kind: Paper · ICLR 2025
      title: MMTEB
      text: Massive Multilingual Text Embedding Benchmark. I am a co-author and contributed Arabic evaluation data.
      url: https://arxiv.org/abs/2502.13595
      go: arxiv.org/abs/2502.13595
    - kind: Model · Demo
      title: RuqLM
      text: A family of small Arabic language models, from 3M to 30M parameters, with public weights.
      url: https://ruqlm.web.app
      go: ruqlm.web.app
    - kind: Library · PyPI
      title: ruqia
      text: Arabic text cleaning, normalization and diacritics. Used for the MMTEB Arabic work.
      url: https://github.com/Ruqyai/Ruqia-Library
      go: pip install ruqia
    - kind: App · PaLM 2
      title: ChatBard
      text: One of the first Arabic apps on PaLM 2. Featured by Google Cloud Tech, with 49 stars on GitHub.
      url: https://github.com/Ruqyai/ChatBard
      go: github.com/Ruqyai/ChatBard
    - kind: Models · Fine-tuning
      title: Gemma 2 for Arabic
      text: Gemma 2 2B and 9B fine-tuned on Arabic data with LoRA, trained across 8 GPUs.
      url: https://huggingface.co/Ruqiya
      go: huggingface.co/Ruqiya
    - kind: Agents · Google ADK
      title: Marketing agents
      text: Agents that write and post LinkedIn content and talk to each other over A2A, running on Gemini 3 Pro.
      url: https://github.com/Ruqyai/Automated-Marketing-Social-Media-System
      go: github.com/Ruqyai

